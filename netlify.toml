[build]
publish = "public"
command = "hugo -b $URL"

[build.environment]
HUGO_VERSION = "0.49"

[context.deploy-preview]
command = "hugo --i18n-warnings -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_GOOGLEANALYTICS = "dev"

[context.branch-deploy]
command = "hugo --i18n-warnings --buildDrafts -b $DEPLOY_PRIME_URL"

[context.deploy-deploy.environment]
HUGO_GOOGLEANALYTICS = "dev"
